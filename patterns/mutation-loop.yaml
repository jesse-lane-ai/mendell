name: mutation-loop
description: "Same melody mutated each 8-bar section (clean -> octave-up -> lowpass -> reverse). Drums + bass constant."
bars: 32
section_bars: 8
sections:
  - {layers: [drums, bass, melody], melody: clean}
  - {layers: [drums, bass, melody], melody: octave-up}
  - {layers: [drums, bass, melody], melody: lowpass}
  - {layers: [drums, bass, melody], melody: reverse}
