[project]
name = "mendell"
version = "0.7.0"
description = "Agent-first music production CLI"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "numpy>=1.26",
    "soundfile>=0.12",
    "mido>=1.3",
    "tomli-w>=1.0",
    "scipy>=1.11",
    "librosa>=0.10",
    "pyrubberband>=0.3",
]

[project.optional-dependencies]
# `library add/scan --recognize clap` — local zero-shot audio-text embedding.
# laion-clap pulls in torch (CPU wheel is large but avoids a GPU requirement);
# an onnxruntime-based CLAP export would be lighter but isn't packaged on PyPI
# as a drop-in, so this stays the documented path until one is.
clap = [
    "torch>=2.0",
    # laion-clap imports torchaudio (mel-spectrogram extraction) and torchvision
    # at runtime but doesn't declare them, so pin them into the extra directly.
    "torchaudio>=2.0",
    "torchvision>=0.15",
    "laion-clap>=1.1",
]
# `library add/scan --recognize gemini-embedding|gemini-generative` — cloud
# recognition via the Gemini API. Needs GEMINI_API_KEY/GOOGLE_API_KEY at runtime.
gemini = [
    "google-genai>=0.3",
]
# `ace ...` and `library ... --recognize ace-step` — ACE-Step 1.5, an open
# generative audio model family (generation, cover, repaint, separation,
# vocal2bgm, audio understanding). Heavyweight + GPU-oriented (CUDA/MPS/ROCm/
# XPU/CPU); needs a downloaded checkpoint pointed to by ACESTEP_CHECKPOINT_DIR.
#
# ACE-Step is not published on PyPI — it's installed from its source repo
# (`uv sync` in an ACE-Step checkout, or `pip install` from the GitHub URL).
# So this extra carries no resolvable pin; install ACE-Step into the same
# environment separately, e.g.:
#   pip install 'git+https://github.com/ace-step/ACE-Step-1.5'
# The `ace.engine` wrapper lazy-imports `acestep` and raises an actionable
# error if it (or ACESTEP_CHECKPOINT_DIR) is missing.
ace = []

[project.scripts]
mendell = "mendell.cli.main:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
