[project]
name = "mendell"
version = "0.7.0"
description = "Agent-first music production CLI"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "numpy>=1.26",
    "soundfile>=0.12",
    "mido>=1.3",
    "tomli-w>=1.0",
    "scipy>=1.11",
    "librosa>=0.10",
    "pyrubberband>=0.3",
]

[project.optional-dependencies]
# `library add/scan --recognize clap` — local zero-shot audio-text embedding.
# laion-clap pulls in torch (CPU wheel is large but avoids a GPU requirement);
# an onnxruntime-based CLAP export would be lighter but isn't packaged on PyPI
# as a drop-in, so this stays the documented path until one is.
clap = [
    "torch>=2.0",
    "laion-clap>=1.1",
]
# `library add/scan --recognize gemini-embedding|gemini-generative` — cloud
# recognition via the Gemini API. Needs GEMINI_API_KEY/GOOGLE_API_KEY at runtime.
gemini = [
    "google-genai>=0.3",
]

[project.scripts]
mendell = "mendell.cli.main:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
