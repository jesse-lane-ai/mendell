[project]
name = "mendell"
version = "0.6.0"
description = "Agent-first music production CLI"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "numpy>=1.26",
    "soundfile>=0.12",
    "mido>=1.3",
    "tomli-w>=1.0",
    "scipy>=1.11",
    "librosa>=0.10",
    "pyrubberband>=0.3",
]

[project.scripts]
mendell = "mendell.cli.main:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
